<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>docbro</title>
    <link rel="stylesheet" href="styles/lightbox.css">
    <link rel="stylesheet" href="libraries/katex/styles/katex.min.css">
    <link rel="stylesheet" href="libraries/highlight/styles/atom-one-light.min.css">
    <link rel="stylesheet" href="libraries/wunderbaum/styles/wunderbaum.css">
    <link rel="stylesheet" href="libraries/fontawesome/all.min.css">
    <link rel="stylesheet" href="libraries/jspanel/jspanel.min.css">
    <link rel="stylesheet" href="libraries/easymde/easymde.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/tabs.css">
    <link rel="stylesheet" href="styles/selection.css">
    <link rel="stylesheet" href="styles/content-panel.css">
    <link rel="stylesheet" href="styles/chat-panel.css">
</head>
<body>
    <div class="logo">docbro</div>
    <div class="container">
        <div class="tabs-container" id="tabsContainer"></div>
        <div class="main-split-container">
            <div class="toc-pane" id="tocPane">
                <div id="tocTree"></div>
            </div>
            <div class="content-pane" id="contentPane">
                <div class="content-container" id="contentContainer">
                </div>
                <div class="pdf-controlbox" id="pdfControlBox" style="display:none" aria-label="PDF controls">
                    <button class="pcb-btn" id="pcbPrev" title="Previous page" aria-label="Previous page">&#8249;</button>
                    <span class="pcb-page">
                        <input id="pcbPageInput" class="pcb-page-input" type="text" inputmode="numeric" value="1" aria-label="Current page">
                        <span class="pcb-page-sep">/</span>
                        <span id="pcbPageTotal" class="pcb-page-total">0</span>
                    </span>
                    <button class="pcb-btn" id="pcbNext" title="Next page" aria-label="Next page">&#8250;</button>
                    <span class="pcb-sep"></span>
                    <button class="pcb-btn" id="pcbZoomOut" title="Zoom out" aria-label="Zoom out">&#8722;</button>
                    <span class="pcb-zoom" id="pcbZoomValue">100%</span>
                    <button class="pcb-btn" id="pcbZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
                    <button class="pcb-btn pcb-glyph" id="pcbFitWidth" title="Fit width" aria-label="Fit width">&#8596;</button>
                    <button class="pcb-btn pcb-glyph" id="pcbFitPage" title="Fit page" aria-label="Fit page">&#10530;</button>
                    <span class="pcb-sep"></span>
                    <span class="pcb-cols-icon" title="Pages per row">&#9638;</span>
                    <input type="range" id="pcbColumns" class="pcb-cols" min="1" max="4" step="1" value="1" title="Pages per row" aria-label="Pages per row">
                    <span class="pcb-cols-value" id="pcbColumnsValue">1</span>
                    <span class="pcb-sep"></span>
                    <button class="pcb-btn pcb-glyph" id="pcbRotate" title="Rotate" aria-label="Rotate pages">&#10227;</button>
                </div>
            </div>
            <div class="right-pane" id="rightPane"></div>
        </div>
    </div>

    <script src="./libraries/socket.io/socket.io.min.js"></script>
    <script src="./libraries/katex/katex.min.js"></script>
    <script src="./libraries/marked/marked.min.js"></script>
    <script src="./libraries/highlight/highlight.min.js"></script>
    <script src="./libraries/split/split.min.js"></script>
    <script src="./libraries/wunderbaum/wunderbaum.umd.min.js"></script>
    <script src="./libraries/mermaid/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false });</script>
    <script src="./libraries/mermaid/mermaid.min.js"></script>
    <script src="./libraries/jspanel/jspanel.min.js"></script>
    <script src="./libraries/easymde/easymde.min.js"></script>
    <script src="./libraries/drawio/viewer-static.min.js"></script>
    <script type="module" src="./script/app.js"></script>
</body>
</html>
